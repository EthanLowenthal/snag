[project]
name = "snag"
version = "0.1.0"
description = "A TUI file browser for snagging files off servers over rsync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]

[project.scripts]
snag = "snag.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snag"]
