[project]
name = "snag"
version = "1.0.2"
description = "A TUI file browser for snagging files off servers over rsync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=1.0", "setproctitle>=1.3"]

[project.scripts]
snag = "snag.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snag"]
